name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[witness,test]'
      - run: pytest -q   # offline: local TLS 1.2/1.3 servers and a fake provider, no keys or network
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t kremlin-witness:ci .
      - run: docker run --rm --entrypoint kremlin-witness kremlin-witness:ci --help
